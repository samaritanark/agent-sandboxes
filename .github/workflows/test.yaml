---
# yaml-language-server:$schema=https://json.schemastore.org/github-workflow.json
#
# Run the cluster-free test suite on every push.
#
# This workflow lives under .github/workflows/ rather than .gitea/workflows/
# so it runs on both platforms: Gitea Actions reads .github/workflows/ by
# default (1.21+), and GitHub Actions only reads .github/workflows/. One
# file, both CI systems.
#
# This runs `task test`, the full cluster-free suite (YAML/config helpers,
# profile/overlay resolution, the secret gate, vetting, audit/transcript
# logic, ...). The remaining tests in tests/ require a live k3s cluster
# (Cilium, gVisor, real `sandbox run`) and are run manually against a real
# environment.
#
# betterleaks is installed below because the secret-gate tests are gated on
# it, and skip() is `exit 0` (it ends the whole test file). Without the
# binary, tests/test-secret-gate.sh would bail at its first betterleaks-gated
# case and exit 0 — a green check that silently skips the entire gate suite.

on:  # yamllint disable-line rule:truthy
  push:

jobs:
  test:
    # Careful: Gitea / GitHub branch protection rules may key off this name.
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Taskfile
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install betterleaks (the secret-gate tests are gated on it)
        run: |
          . setup/common.sh
          SANDBOX_BETTERLEAKS_VERSION=1.7.3 install_betterleaks

      - name: Run cluster-free tests
        run: task test
