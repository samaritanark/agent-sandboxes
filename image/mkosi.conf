# The v3 appliance image (design 5.3): Ubuntu 24.04, booted by Lima (vz on macOS, qemu on Linux)
# with cloud-init. Build with image/build.sh, which stages the in-VM sandbox and the release file
# into mkosi.extra first. This first stage has no containerd, Kata, gateway, or sandboxd yet, and
# its root file system is plain ext4 (dm-verity and the separate state disk come later).

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
ImageId=sandbox-appliance
CompressOutput=no
OutputDirectory=mkosi.output
CacheDirectory=mkosi.cache
PackageCacheDirectory=mkosi.cache/packages

[Content]
Bootable=yes
Bootloader=systemd-boot
# The last console= becomes /dev/console, where cloud-init and systemd write: hvc0 is vz's virtio
# console, which Lima records in serialv.log; on qemu the serial port is ttyS0 or ttyAMA0.
KernelCommandLine=console=tty0 console=ttyS0 console=ttyAMA0 console=hvc0
Packages=
        linux-virtual
        systemd-boot-efi
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        cloud-init
        cloud-guest-utils
        locales
        netplan.io
        openssh-server
        iproute2
        nftables
        ca-certificates
        sudo
        git
        e2fsprogs
