# Tuning for the Kata microVMs, nested on Apple silicon (measured 2026-11-26, docs/design/spikes/S8.md
# "Agent performance in the microVM"). Neither setting changes what a microVM can reach or do.

# Let Cloud Hypervisor back a microVM's memory with transparent huge pages. With virtio-fs the
# guest's memory is shared memory, which the kernel gives huge pages only when shmem_enabled allows
# it (Ubuntu's default is never); "advise" limits them to memory a program asks for, as Cloud
# Hypervisor does. With 4 KiB pages, starting a process in a microVM was about 5 times slower.
w /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise

# How long KVM keeps a halted microVM vCPU polling before it sleeps (default 0.5 ms). Waking a vCPU
# that slept goes through both hypervisors and took about 0.8 ms; with 5 ms of polling a thread woken
# within that time answers in about 0.06 ms, which halved Claude Code's keystroke echo. The window
# grows only while polling pays off, and an idle session cost 0.3% more of a host CPU.
w /sys/module/kvm/parameters/halt_poll_ns - - - - 5000000
