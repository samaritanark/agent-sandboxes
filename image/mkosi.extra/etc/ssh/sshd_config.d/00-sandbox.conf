# The only host key is the one the sandbox host binary generated and pinned (design 5.2.5). Until
# sandbox-seed.service installs it, sshd has no host key and refuses to start, so nothing ever
# answers with a key the host did not pin.
HostKey /etc/sandbox/ssh/ssh_host_ed25519_key
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
