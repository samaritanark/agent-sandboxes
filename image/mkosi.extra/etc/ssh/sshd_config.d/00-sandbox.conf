# The only host key is the one the sandbox host binary generated and pinned (design 5.2.5). Until
# sandbox-seed.service installs it, sshd has no host key and refuses to start, so nothing ever
# answers with a key the host did not pin.
HostKey /etc/sandbox/ssh/ssh_host_ed25519_key
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
# The host opens one connection per repository for a session's workspace sync (up to 128), a few
# at a time per command, and two launches can overlap; past sshd's default MaxStartups (10:30:100)
# sshd drops new connections at random. This port is reachable only through netd from the host's
# loopback, and each connection must still present the pinned client key, so the higher limit
# costs nothing against an outsider.
MaxStartups 64:30:256
